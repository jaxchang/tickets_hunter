name: CI

# Minimal guardrail for this fork (issue #5): compile every source file and
# run the unit tests on each pull request and on pushes to main. The release
# build stays in build-release.yml (tags / manual dispatch only).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        # tests import nodriver_common, which pulls zendriver and (through
        # settings) tornado; versions mirror requirement.txt.
        run: pip install requests==2.34.2 tornado==6.6.1 zendriver==0.16.0
        
      - name: Compile all sources
        run: python -m compileall -q src

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
